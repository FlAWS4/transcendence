<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Une exploration de l’accueil de 42 Horizon, autour du globe et de sa communauté.">
  <title>42 Horizon — Un monde à explorer</title>
  <link rel="stylesheet" href="../../../shared/brand/tokens.css">
  <link rel="stylesheet" href="../../../shared/assets/jost.css">
  <link rel="stylesheet" href="welcome.css">
  <link rel="stylesheet" href="city-map.css">
  <script src="../../../shared/map-data/d3.min.js" defer></script>
  <script src="../../../shared/map-data/topojson.min.js" defer></script>
  <script src="globe.js" defer></script>
  <script src="welcome.mjs" type="module"></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5Z"/></symbol>
    <symbol id="i-projects" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6m1 4a4 4 0 0 1 3 4v1"/></symbol>
    <symbol id="i-journal" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M9 3v18m4-12h3m-3 4h3"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13a8.5 8.5 0 0 1-9.5-9.5A8.5 8.5 0 1 0 20.5 13Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m10 6-6 6 6 6m-6-6h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14m-7-7v14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  </svg>
  <div class="app" id="app" data-section="explore">
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="header">
      <a class="brand" href="#explore" aria-label="42 Horizon"><img src="../../../shared/brand/logo-42.svg" alt="42" width="58" height="41"><span class="brand-names"><span class="arabic-brand" lang="ar">أفق</span><span>HORIZON</span></span></a>
      <div class="utilities">
        <button class="utility" id="language" aria-label="Changer de langue" aria-haspopup="dialog">FR</button>
        <button class="utility" id="theme" aria-label="Activer le thème sombre" aria-pressed="false"><svg><use href="#i-moon"/></svg></button>
        <button class="utility profile" id="profile" aria-label="Mon compte" aria-haspopup="dialog"><svg><use href="#i-user"/></svg></button>
      </div>
    </header>
    <main id="main">
      <nav class="main-nav" id="main-nav" aria-label="Navigation principale">
        <span class="nav-indicator" aria-hidden="true"></span>
        <button data-section="explore" aria-current="page"><svg><use href="#i-compass"/></svg><span data-copy="explore">Explorer</span></button>
        <button data-section="projects"><svg><use href="#i-projects"/></svg><span data-copy="projects">Projets</span></button>
        <button data-section="people"><svg><use href="#i-people"/></svg><span data-copy="people">Parcours</span></button>
        <button data-section="journal"><svg><use href="#i-journal"/></svg><span data-copy="journal">Le journal</span></button>
      </nav>
      <div class="scope-bar">
        <button class="scope-back icon-button" id="scope-back" aria-label="Revenir au niveau précédent" disabled><svg><use href="#i-back"/></svg></button>
        <button class="scope-picker" id="scope-picker" aria-haspopup="dialog"><svg><use href="#i-globe"/></svg><span id="scope-name" dir="auto">Le monde</span><svg class="chevron"><use href="#i-down"/></svg></button>
      </div>
      <div class="globe-stage" id="globe" tabindex="0"></div>
      <div class="city-stage" id="city-map" hidden></div>
      <div class="globe-footer">
        <p id="globe-hint">Fais tourner le monde.</p>
        <div class="globe-controls">
          <button class="icon-button" id="zoom-out" aria-label="Dézoomer"><svg><use href="#i-minus"/></svg></button>
          <button class="icon-button world-control" id="reset" aria-label="Revenir au monde"><svg><use href="#i-globe"/></svg></button>
          <button class="icon-button" id="zoom-in" aria-label="Zoomer"><svg><use href="#i-plus"/></svg></button>
        </div>
      </div>
      <section class="content-sheet" id="content-sheet" aria-labelledby="section-title" inert>
        <div class="sheet-top"><p class="section-scope" id="section-scope" dir="auto"></p><button class="icon-button" id="close-sheet" aria-label="Revenir au globe"><svg><use href="#i-close"/></svg></button></div>
        <h1 id="section-title"></h1>
        <p class="section-intro" id="section-intro"></p>
        <div class="content-list" id="content-list"></div>
        <p class="sample-note" data-copy="sample">Contenus de démonstration</p>
      </section>
      <p class="loading-status" id="loading" role="status">Le monde se prépare…</p>
    </main>
    <button class="prototype-note" id="about" data-copy="prototype">Exploration · 42 Horizon</button>
    <p class="sr-only" id="announcement" aria-live="polite"></p>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-top"><h2 id="dialog-title"></h2><button class="icon-button" id="close-dialog" aria-label="Fermer"><svg><use href="#i-close"/></svg></button></div>
    <div id="dialog-content"></div>
  </dialog>
</body>
</html>
