<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagination compacte avec libellés —13 octobre</title><link rel="stylesheet" href="content-pagination.css"><style>:root{--cp-line:#c9d5d5;--h42-color-muted:#485c60;--cp-accent:#007e83;--warm-soft:#e9f6f6;--h42-color-focus:#008888}body{font:16px sans-serif;color:#193237;background:#f7fafa;margin:24px auto;padding:0 16px;max-width:800px}h1{font-size:24px}button,select{font:inherit}label{display:block;margin:24px 0}</style><h1>Pagination compacte avant les flèches</h1><p>Composant conservé : cinq numéros maximum, ellipses, Précédent/Suivant avec leur texte visible.</p><label>Nombre de pages <select id="count"><option>7</option><option>100</option></select></label><nav id="pages" class="cp-pagination"></nav><script type="module">import {renderContentPagination} from './content-pagination-ui.mjs';let page=1;const count=document.querySelector('#count');function render(){renderContentPagination({container:document.querySelector('#pages'),state:{page,pageCount:Number(count.value),total:Number(count.value)*12},getHref:n=>'#page='+n,onNavigate:(event,n)=>{event.preventDefault();page=n;render()}})}count.onchange=()=>{page=1;render()};render();</script></html>
