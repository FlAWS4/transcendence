  </g>
  <g fill="none" stroke="#078f88" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M446 190h66m-14-14 14 14-14 14M716 290v44m-14-14 14 14 14-14M514 434h-66m14-14-14 14 14 14"/>
  </g>
  <g font-family="monospace" fill="#25363c">
    <g font-size="21" fill="#087b77"><text x="90" y="149">01 · READ</text><text x="562" y="149">02 · PARSE</text><text x="562" y="393">03 · RUN</text><text x="90" y="393">04 · OUTPUT</text></g>
    <text x="90" y="215" font-size="28">&gt; echo "hello"</text>
    <text x="90" y="459" font-size="32">hello</text>
  </g>
  <g fill="#e0f2f0" stroke="#94c6c2" stroke-width="1.5">
    <rect x="562" y="176" width="120" height="48" rx="9"/>
    <rect x="696" y="176" width="173" height="48" rx="9"/>
  </g>
