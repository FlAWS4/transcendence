<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Minishell — illustrative command flow</title>
  <desc id="desc">An original demonstration diagram: read a command, parse it, run it, then return its output. This is not a screenshot of a real implementation.</desc>
