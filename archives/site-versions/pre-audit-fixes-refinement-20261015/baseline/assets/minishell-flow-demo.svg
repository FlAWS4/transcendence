  </g>
  <text x="64" y="68" font-family="monospace" font-size="24" letter-spacing="4" fill="#25363c">MINISHELL</text>
  <g fill="#fff" stroke="#bad3d2" stroke-width="2">
    <rect x="64" y="112" width="360" height="156" rx="20"/>
    <rect x="536" y="112" width="360" height="156" rx="20"/>
