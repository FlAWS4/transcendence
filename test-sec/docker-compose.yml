services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./website:/usr/share/nginx/html:ro

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
    volumes:
        - postgres-data:/var/lib/postgresql
  tester:
    image: curlimages/curl:latest
    command: ["sleep", "infinity"]
  db_tester:
    image: postgres:18
    command: ["sleep", "infinity"]

volumes:
  postgres-data: