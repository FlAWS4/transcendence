<!doctype html>
<!--
  Study "atlas" (24 Oct 2026) — Explorer of version B as a warm travel atlas.
  Static mock-up: the frame (header, scope bar, dock, search, dice, note) is reproduced, not imported.
  Read-only data: ../../../site/campuses.json, campus-profiles.json, campus-websites.json,
  campus-website-locales.json, ../../../site-b/continents.mjs, explorer-model.mjs, campus-logos.json,
  assets/flags, assets/campus-logos. Silhouettes: ../../../site-b/explorer-shapes.mjs with ./atlas-meta.mjs (pins, labels, cuts; tools/build-shapes.cjs),
  ./atlas-standin.mjs only if the site-b asset cannot be imported.
  URL: ?state=l1|l2|l3|paris|lyon|monde &theme=light|dark &lang=fr|en|ar &chrome=0 (hides the switcher)
-->
<html lang="fr" data-theme="light" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Atlas chaleureux · Explorer B</title>
  <link rel="preload" href="../../../shared/assets/jost-1.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="../../../shared/brand/tokens.css">
  <link rel="stylesheet" href="../../../shared/assets/jost.css">
  <link rel="stylesheet" href="atlas.css?v=1">
  <script type="module" src="atlas.mjs?v=1"></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5Z"/></symbol>
    <symbol id="i-projects" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6m1 4a4 4 0 0 1 3 4v1"/></symbol>
    <symbol id="i-journal" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M9 3v18m4-12h3m-3 4h3"/></symbol>
    <symbol id="i-awards" viewBox="0 0 24 24"><path d="M8 3h8v6a4 4 0 0 1-8 0V3Z"/><path d="M8 5H4v2a4 4 0 0 0 4 4m8-6h4v2a4 4 0 0 1-4 4m-4 2v5m-4 3h8m-6-3h4v3"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m10 6-6 6 6 6m-6-6h16"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r=".9" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r=".9" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r=".9" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r=".9" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 9V6.5A2.5 2.5 0 0 0 12.5 4h-6A2.5 2.5 0 0 0 4 6.5v6A2.5 2.5 0 0 0 6.5 15H9"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.5 3.5h3l1.5 4.5-2 1.5a11 11 0 0 0 5.5 5.5l1.5-2 4.5 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4.5 5.5a2 2 0 0 1 2-2Z"/></symbol>
    <symbol id="i-form" viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 9h8m-8 4h8m-8 4h5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4m8-4v4M3.5 10h17"/></symbol>
    <symbol id="i-key-left" viewBox="0 0 24 24"><path d="M15 12H9m3-3-3 3 3 3"/></symbol>
    <symbol id="i-key-right" viewBox="0 0 24 24"><path d="M9 12h6m-3-3 3 3-3 3"/></symbol>
    <symbol id="i-enter" viewBox="0 0 24 24"><path d="M17 7v4a2 2 0 0 1-2 2H8m3-3-3 3 3 3"/></symbol>
  </svg>

  <div class="app" id="app" data-navigation="dock" data-section="explore">
    <div class="atmosphere" aria-hidden="true"></div>
    <header class="header">
      <a class="brand" href="#" aria-label="42 Horizon"><img src="../../../shared/brand/logo-42.svg" alt="42" width="58" height="41"><span class="brand-names"><span class="arabic-brand" lang="ar">أفق</span><span class="wordmark" dir="ltr">HORIZON</span></span></a>
      <div class="utilities"><button class="glass-round" id="profile" type="button" aria-label="Mon compte"><svg aria-hidden="true"><use href="#i-user"/></svg></button></div>
    </header>

    <main id="main">
      <div class="scope-bar" id="scope-bar" data-level="world">
        <div class="scope-row">
          <button class="glass-round scope-back" id="scope-back" type="button" aria-label="Revenir au niveau précédent" hidden><svg aria-hidden="true"><use href="#i-back"/></svg></button>
          <nav class="scope-path" aria-label="Chemin géographique">
            <span class="scope-medallion" aria-hidden="true"><svg><use href="#i-globe"/></svg></span>
            <ol class="scope-trail" id="scope-trail"></ol>
          </nav>
        </div>
        <p class="scope-status" id="scope-status"></p>
      </div>

      <section class="atlas-stage" id="explorer" tabindex="-1" aria-labelledby="explorer-title">
        <h1 class="sr-only" id="explorer-title">Explorer</h1>
        <div class="atlas-paper" aria-hidden="true"></div>
        <div class="atlas-view" id="atlas-view"></div>
      </section>

      <p class="about" id="about">Exploration · 42 Horizon</p>
      <div class="dock-shell">
        <div class="dock-tools">
          <button class="glass-capsule" id="search" type="button"><span id="search-label">Chercher dans Horizon</span></button>
          <button class="glass-round dice" id="dice" type="button" aria-label="Visiter un campus"><svg aria-hidden="true"><use href="#i-dice"/></svg></button>
        </div>
        <nav class="dock" id="dock" aria-label="Navigation principale">
          <button data-section="explore" aria-current="page"><svg aria-hidden="true"><use href="#i-compass"/></svg><span data-copy="explore">Explorer</span></button>
          <button data-section="projects"><svg aria-hidden="true"><use href="#i-projects"/></svg><span data-copy="projects">Projets</span></button>
          <button data-section="people"><svg aria-hidden="true"><use href="#i-people"/></svg><span data-copy="people">Profils</span></button>
          <button data-section="journal"><svg aria-hidden="true"><use href="#i-journal"/></svg><span data-copy="journal">Chroniques</span></button>
          <button data-section="awards"><svg aria-hidden="true"><use href="#i-awards"/></svg><span data-copy="awards">42 Awards</span></button>
        </nav>
      </div>
      <p class="sr-only" id="announce" aria-live="polite"></p>
    </main>
  </div>

  <aside class="study-switcher" id="switcher" aria-label="Étude atlas · états">
    <p class="study-title">Atlas · états</p>
    <div class="study-row" data-group="state">
      <button type="button" data-state="l1">L1</button><button type="button" data-state="l2">L2</button><button type="button" data-state="l3">L3</button><button type="button" data-state="paris">Paris</button><button type="button" data-state="lyon">Lyon</button><button type="button" data-state="monde">Monde</button>
    </div>
    <div class="study-row" data-group="theme"><button type="button" data-theme-choice="light">Clair</button><button type="button" data-theme-choice="dark">Sombre</button></div>
    <div class="study-row" data-group="lang"><button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ar">AR</button></div>
    <p class="study-help">Flèches, Entrée, Échap · clic sur une forme</p>
  </aside>
</body>
</html>
