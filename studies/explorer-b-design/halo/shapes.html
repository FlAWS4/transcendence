<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Silhouettes — Halo et lumière</title>
  <link rel="stylesheet" href="../../../shared/assets/jost.css">
  <style>
    :root { color-scheme: light; font-family: Jost, sans-serif; }
    body { margin: 0; padding: 24px; background: #F7FAFA; color: #1B1B1B; }
    h1 { font-weight: 500; font-size: 20px; margin: 0 0 4px; }
    p { margin: 0 0 20px; color: #536163; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    figure { margin: 0; padding: 12px; border-radius: 16px; background: #fff; box-shadow: 0 2px 10px #183D3C10; }
    figure svg { width: 100%; height: 200px; display: block; }
    figcaption { font-size: 13px; color: #536163; margin-top: 6px; }
    .land { fill: #6FD0C9; } .dot { fill: #ED3491; stroke: #fff; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
    .anchor { fill: none; stroke: #1B1B1B; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  </style>
</head>
<body>
  <h1>Silhouettes de remplacement de l’étude</h1>
  <p>Fichier <code>shapes-standin.js</code> : monde, continents et 30 pays, avec la position des campus (points roses) et le point d’ancrage du nom (cercle). Le module définitif est <code>site-b/explorer-shapes.mjs</code>.</p>
  <div class="grid" id="grid"></div>
  <script type="module">
    import {SHAPES} from './shapes-standin.js';
    const grid = document.getElementById('grid');
    const add = (name, shape) => {
      const [, , w, h] = shape.viewBox.split(' ').map(Number);
      const fig = document.createElement('figure');
      const dots = (shape.dots || []).map(([x, y]) => `<circle class="dot" cx="${x}" cy="${y}" r="${Math.max(w, h) / 90}"/>`).join('');
      const anchor = shape.label ? `<circle class="anchor" cx="${shape.label[0] / 100 * w}" cy="${shape.label[1] / 100 * h}" r="${Math.max(w, h) / 40}"/>` : '';
      const sphere = shape.sphere ? `<circle cx="${shape.sphere.cx}" cy="${shape.sphere.cy}" r="${shape.sphere.r}" fill="#E4F4F3"/>` : '';
      fig.innerHTML = `<svg viewBox="${shape.viewBox}" aria-hidden="true">${sphere}<path class="land" d="${shape.d}"/>${dots}${anchor}</svg><figcaption>${name} · ${shape.viewBox} · ${(shape.dots || []).length} campus</figcaption>`;
      grid.append(fig);
    };
    add('Monde', SHAPES.world);
    for (const [k, v] of Object.entries(SHAPES.continents)) add(k, v);
    for (const [k, v] of Object.entries(SHAPES.countries)) add(k, v);
  </script>
</body>
</html>
